name: Discord Release Notification

on:
  release:
    types: [published]

jobs:
  notify-discord:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get short SHA
        id: sha
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "sha_short=$SHORT_SHA" >> $GITHUB_OUTPUT
      
      - name: Get actor avatar
        id: avatar
        run: |
          AVATAR_URL=$(curl -s "https://api.github.com/users/${{ github.actor }}" | jq -r '.avatar_url')
          echo "avatar_url=$AVATAR_URL" >> $GITHUB_OUTPUT
      
      - name: Get release info
        id: release
        run: |
          echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          echo "release_url=${{ github.event.release.html_url }}" >> $GITHUB_OUTPUT
          
          # Get the previous tag for comparison
          PREV_TAG=$(git describe --tags --abbrev=0 ${{ github.event.release.tag_name }}^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            # If no previous tag, compare with initial commit
            echo "prev_tag=initial" >> $GITHUB_OUTPUT
          else
            echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Discord payload
        id: payload
        run: |
          jq -n \
            --arg avatar_url "https://images.icon-icons.com/1476/PNG/512/github_101792.png" \
            --arg actor "${{ github.actor }}" \
            --arg actor_avatar "${{ steps.avatar.outputs.avatar_url }}" \
            --arg repo "${{ github.repository }}" \
            --arg title "New Release ${{ steps.release.outputs.tag_name }}" \
            --arg sha "${{ steps.sha.outputs.sha_short }}" \
            --arg timestamp "${{ github.event.release.published_at }}" \
            --arg tag_name "${{ steps.release.outputs.tag_name }}" \
            --arg prev_tag "${{ steps.release.outputs.prev_tag }}" \
            --arg release_url "${{ steps.release.outputs.release_url }}" \
            '{
              embeds: [{
                color: 3066993,
                thumbnail: { url: $avatar_url },
                author: { name: $actor, icon_url: $actor_avatar },
                title: $title,
                description: ("**Release:** " + $tag_name + "\n**Previous:** " + $prev_tag + "\n\n**View Release:** [Get Release](" + $release_url + ")"),
                timestamp: $timestamp
              }]
            }' > payload.json
          echo "Payload content:"
          cat payload.json
      
      - name: Send Discord notification
        run: |
          curl -v -H "Content-Type: application/json" \
               -d @payload.json \
               ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
